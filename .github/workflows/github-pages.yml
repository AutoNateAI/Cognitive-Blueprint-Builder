name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Get full history for proper branch creation
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: List directory contents for debugging
        run: ls -la
      
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v3
        
      - name: Deploy to GitHub Pages
        run: |
          # Configure git with token-based authentication
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Create and switch to orphan gh-pages branch (no history)
          git checkout --orphan gh-pages
          
          # Clear everything except the web app directory
          find . -maxdepth 1 ! -name 'mental_arch_web_tutorial' ! -name '.git' -exec rm -rf {} \;
          
          # Verify the web app directory exists
          ls -la
          
          # Move web app contents to root
          mv mental_arch_web_tutorial/* .
          rm -rf mental_arch_web_tutorial/
          
          # Add all content to git
          git add .
          
          # Commit changes
          git commit -m "Deploy to GitHub Pages" || echo "Nothing to commit"
          
          # Force push to gh-pages branch using token authentication
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin gh-pages
