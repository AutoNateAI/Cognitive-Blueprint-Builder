name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Copy web app to gh-pages branch
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git checkout -b gh-pages || git checkout gh-pages
          git pull origin gh-pages --rebase || true
          
          # Remove all files except .git to ensure clean deployment
          find . -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} \;
          
          # Copy mental_arch_web_tutorial contents to root
          cp -r mental_arch_web_tutorial/* .
          
          # Add, commit and push
          git add .
          git commit -m "Update GitHub Pages" || echo "No changes to commit"
          git push -f origin gh-pages
